name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "yukari" ]
  pull_request:
    branches: [ "yukari" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      run: |
        ANDROID_HOME="$HOME/android-sdk"
        COMPILE_SDK="34"
        BUILD_TOOLS="34.0.0"
        NDK_VERSION="25.2.9519653"
        CMDLINE_TOOLS_ID="11076708"
        
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        
        wget -q --show-progress "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_ID}_latest.zip" -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        rm /tmp/cmdline-tools.zip
        
        if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
        fi
        
        export ANDROID_HOME="$ANDROID_HOME"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        
        sdkmanager --install "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}"
        
        sdkmanager --install "ndk;${NDK_VERSION}"
        
        cat > local.properties << EOF
        sdk.dir=$ANDROID_HOME
        ndk.dir=$ANDROID_HOME/ndk/$NDK_VERSION
        EOF
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew :YukariLauncher:assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: YukariLauncher-debug
        path: YukariLauncher/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload build reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: |
          **/build/reports/
          **/build/outputs/logs/
        retention-days: 7
